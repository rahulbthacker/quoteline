[project]
name = "quoteline-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "google-genai>=2.25.0",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
gen = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# The dataset generators (make seed) and their tests need the gen group.
default-groups = ["dev", "gen"]
